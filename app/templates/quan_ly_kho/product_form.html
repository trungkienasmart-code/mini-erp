{% extends "base.html" %}

{% block title %}{{ "Sửa" if is_edit else "Thêm" }} Sản phẩm{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>
        <i class="bi bi-box-seam"></i>
        {{ "Sửa Sản phẩm" if is_edit else "Thêm Sản phẩm mới" }}
    </h2>
    <a href="/inventory/products" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Quay lại
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post"
              action="{{ '/inventory/products/' + product.id|string + '/update' if is_edit else '/inventory/products/create' }}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Mã SKU <span class="text-danger">*</span></label>
                    <input type="text" name="sku" class="form-control" required
                           value="{{ product.sku if product else '' }}">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required
                           value="{{ product.name if product else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Đơn vị tính</label>
                    <input type="text" name="unit" class="form-control"
                           value="{{ product.unit if product else 'Cái' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Giá nhập (VNĐ)</label>
                    <input type="number" name="cost_price" class="form-control" step="100"
                           value="{{ product.cost_price if product else 0 }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Giá bán (VNĐ)</label>
                    <input type="number" name="price" class="form-control" step="100"
                           value="{{ product.price if product else 0 }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Danh mục</label>
                    <select name="category_id" class="form-select">
                        <option value="">-- Chưa phân loại --</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}"
                                {% if product and product.category_id == cat.id %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <hr class="my-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> {{ "Cập nhật" if is_edit else "Thêm mới" }}
            </button>
            <a href="/inventory/products" class="btn btn-secondary">Hủy</a>
        </form>
    </div>
</div>
{% endblock %}
