{% extends "base.html" %}
{% block title %}{{ "Sửa" if is_edit else "Thêm" }} Mã giảm giá{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-ticket-perforated"></i> {{ "Sửa mã" if is_edit else "Thêm mã" }}</h2>
    <a href="/sales/discounts" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Quay lại
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" action="/sales/discounts/create">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Mã <span class="text-danger">*</span></label>
                    <input type="text" name="code" class="form-control" required
                           placeholder="VD: SALE10, VIP20"
                           value="{{ code.code if code else '' }}">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Tên chương trình <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required
                           placeholder="VD: Giảm giá Tết 2026"
                           value="{{ code.name if code else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Loại giảm</label>
                    <select name="discount_type" class="form-select">
                        <option value="PERCENT"
                                {% if not code or code.discount_type == "PERCENT" %}selected{% endif %}>
                            Phần trăm (%)
                        </option>
                        <option value="AMOUNT"
                                {% if code and code.discount_type == "AMOUNT" %}selected{% endif %}>
                            Số tiền (VNĐ)
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Giá trị giảm</label>
                    <input type="number" name="discount_value" class="form-control" step="0.1"
                           value="{{ code.discount_value if code else 0 }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Giảm tối đa (nếu %)</label>
                    <input type="number" name="max_discount" class="form-control" step="1000"
                           value="{{ code.max_discount if code else 0 }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Đơn tối thiểu (VNĐ)</label>
                    <input type="number" name="min_order_amount" class="form-control" step="1000"
                           value="{{ code.min_order_amount if code else 0 }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Số lần dùng tối đa (0=không giới hạn)</label>
                    <input type="number" name="max_uses" class="form-control"
                           value="{{ code.max_uses if code else 0 }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Trạng thái</label>
                    <select name="status" class="form-select">
                        <option value="ACTIVE"
                                {% if not code or code.status == "ACTIVE" %}selected{% endif %}>
                            Hoạt động
                        </option>
                        <option value="INACTIVE"
                                {% if code and code.status == "INACTIVE" %}selected{% endif %}>
                            Ngừng
                        </option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" name="requires_approval" value="true"
                               class="form-check-input" id="req_appr"
                               {% if code and code.requires_approval %}checked{% endif %}>
                        <label class="form-check-label" for="req_appr">
                            Cần quản lý duyệt (dùng cho mã đặc biệt)
                        </label>
                    </div>
                </div>
                <div class="col-12">
                    <label class="form-label">Ghi chú</label>
                    <textarea name="note" class="form-control" rows="2">{{ code.note if code else '' }}</textarea>
                </div>
            </div>
            <hr>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> {{ "Cập nhật" if is_edit else "Thêm mới" }}
            </button>
            <a href="/sales/discounts" class="btn btn-secondary">Hủy</a>
        </form>
    </div>
</div>
{% endblock %}
