{% extends "base.html" %}
{% block title %}{{ "Sửa" if is_edit else "Thêm" }} Khách hàng{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-people"></i> {{ "Sửa KH" if is_edit else "Thêm KH" }}</h2>
    <a href="/sales/customers" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Quay lại
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post"
              action="{{ '/sales/customers/' + customer.id|string + '/update' if is_edit else '/sales/customers/create' }}">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Mã KH <span class="text-danger">*</span></label>
                    <input type="text" name="code" class="form-control" required
                           value="{{ customer.code if customer else '' }}">
                </div>
                <div class="col-md-9">
                    <label class="form-label">Tên khách hàng <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required
                           value="{{ customer.name if customer else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">SĐT</label>
                    <input type="text" name="phone" class="form-control"
                           value="{{ customer.phone if customer else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control"
                           value="{{ customer.email if customer else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Mã số thuế</label>
                    <input type="text" name="tax_code" class="form-control"
                           value="{{ customer.tax_code if customer else '' }}">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Địa chỉ</label>
                    <input type="text" name="address" class="form-control"
                           value="{{ customer.address if customer else '' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Loại khách</label>
                    <select name="customer_type" class="form-select">
                        <option value="RETAIL"
                                {% if not customer or customer.customer_type == "RETAIL" %}selected{% endif %}>
                            Khách lẻ
                        </option>
                        <option value="WHOLESALE"
                                {% if customer and customer.customer_type == "WHOLESALE" %}selected{% endif %}>
                            Khách buôn / Doanh nghiệp
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Hạn mức công nợ (VNĐ)</label>
                    <input type="number" name="credit_limit" class="form-control" step="100000"
                           value="{{ customer.credit_limit if customer else 0 }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Ghi chú</label>
                    <textarea name="note" class="form-control" rows="2">{{ customer.note if customer else '' }}</textarea>
                </div>
            </div>
            <hr>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> {{ "Cập nhật" if is_edit else "Thêm mới" }}
            </button>
            <a href="/sales/customers" class="btn btn-secondary">Hủy</a>
        </form>
    </div>
</div>
{% endblock %}
