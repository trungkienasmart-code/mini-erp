<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Mini ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-header {
            text-align: center;
            padding: 30px 20px 10px;
        }
        .login-header .icon {
            font-size: 3rem;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <i class="bi bi-box-seam icon"></i>
            <h3 class="mt-2 mb-0">Mini ERP</h3>
            <small class="text-muted">Hệ thống quản lý cho HKD</small>
        </div>
        <div class="card-body p-4">
            {% if error %}
            <div class="alert alert-danger py-2">
                <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/auth/login">
                <input type="hidden" name="next" value="{{ next or '/' }}">

                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control form-control-lg"
                               required autofocus
                               value="{{ username or '' }}"
                               placeholder="Nhập username">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control form-control-lg"
                               required placeholder="Nhập mật khẩu">
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" name="remember" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">
                        Ghi nhớ đăng nhập (30 ngày)
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
                </button>
            </form>

            <hr class="my-3">
            <div class="alert alert-info py-2 mb-0">
                <small>
                    <strong>Lần đầu sử dụng?</strong><br>
                    Đăng nhập bằng <code>admin</code> / <code>admin</code> rồi đổi mật khẩu.
                </small>
            </div>
        </div>
    </div>
</body>
</html>
