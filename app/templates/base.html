<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mini ERP{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Navbar giống Odoo -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-box-seam"></i> Mini ERP
        </a>
        <div class="text-white">
            <span class="me-3"><i class="bi bi-person-circle"></i> Admin</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar py-3" style="min-height: calc(100vh - 56px);">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house"></i> Trang chủ</a>
                    </li>
                    {% if modules %}
                        <hr>
                        {% for mod in modules %}
                        <li class="nav-item">
                            <a class="nav-link" href="{{ mod.get('url', '#') }}">
                                <i class="bi {{ mod.get('icon', 'bi-circle') }}"></i> {{ mod.name }}
                            </a>
                        </li>
                        {% endfor %}
                    {% endif %}
                </ul>
            </nav>

            <!-- Nội dung chính -->
            <main class="col-md-10 ms-sm-auto px-4 py-3">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
